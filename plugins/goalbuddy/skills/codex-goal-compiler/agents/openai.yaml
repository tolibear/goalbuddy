interface:
  display_name: "Codex Goal Compiler"
  short_description: "Agreed work to the right Codex goal route"
  default_prompt: "Use $codex-goal-compiler to turn agreed context into the correct goal route. Choose among direct work, planning, a standalone native /goal goal.md, GoalBuddy, Omega, and recurring automation. Default one bounded post-board review/remediation round to a standalone goal. Preserve accepted decisions and observable proof. When GoalBuddy wins, consume compiler contract v1, load the exact installed Goal Prep path as the internal board backend in this context, create and validate a new file-only board, print the start command, and stop without execution."
policy:
  allow_implicit_invocation: true
