interface:
  display_name: "Codex Goal Compiler"
  short_description: "Decision-complete source to a validated GoalBuddy board"
  default_prompt: "Use $codex-goal-compiler to compile this decision-complete specification, accepted plan, or agreed conversation contract into one new validated GoalBuddy board. Preserve accepted decisions, vertical slices, observable completion proof, and an adaptive execution strategy. Explicitly load Goal Prep as the internal schema backend in the current compiler context. If material source decisions are missing, return not_compilable and create nothing. Do not implement or start execution. Do not route to another workflow or mutate an existing board."
policy:
  allow_implicit_invocation: true
